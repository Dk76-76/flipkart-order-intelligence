[project]
name = "flipkart-order-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Devendar-76", email = "kumavatbdevendar@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "joblib>=1.5.3",
    "langgraph>=1.2.11",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.0",
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "uvicorn>=0.52.4",
]

[project.scripts]
flipkart-order-intelligence = "flipkart_order_intelligence:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
